[project]
name = "reap"
version = "0.1.0"
description = "reap: MoE Compression with expert pruning and merging."
readme = "README.md"
authors = [
    { name = "Mike Lasby", email = "mklasby@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.7.0",
    "datasets>=3.6.0, <4.0.0",
    "evalplus[vllm]>=0.3.1",
    "jupyter>=1.1.1",
    "lm-eval[vllm,api]>=0.4.9.1",
    "matplotlib>=3.10.3",
    "python-dotenv>=1.1.0",
    "seaborn>=0.13.2",
    "torch==2.7.1",
    # "transformers==4.53.3",  # latest version working for ernie.
    "transformers==4.55.0",
    "umap-learn>=0.5.7",
    "vllm==0.10.0",
    "livecodebench",
    "deepspeed>=0.17.4",
    "trl>=0.21.0",
    "hatchling>=1.27.0",
    # "flash-attn>=2.7.1,<=2.8.0", # required for xformers for Llama4. Might need to manually install with --no-build-isolation
    # "flash-attn>=2.8.3",
    "wandb>=0.21.1",
    "crfm-helm",
    "evalscope",
]

[[tool.uv.index]]
# B200 (Blackwell, sm_100) needs CUDA 12.8 torch wheels; PyPI default is cu126 (max sm_90).
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
evalplus = { path = "third-party/evalplus", editable = true }
livecodebench = { path="third-party/LiveCodeBench", editable = true}
crfm-helm = { path="third-party/helm", editable = true }
evalscope = { path = "third-party/evalscope", editable=true}
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[project.entry-points."vllm.general_plugins"]
llama_4_text_only = "reap.model_util:register_llama_with_vllm"
kimi_k25_text_only = "reap.model_util:register_kimi_k25_with_vllm"
# Installs the EP-node-failure routing hook in every worker process. Inert
# until a mask is set (via POST /reap/failure or the REAP_* env vars), so it is
# safe to leave enabled for ordinary serving.
expert_failure = "reap.expert_failure:patch_select_experts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "kaleido>=1.0.0",
    "matplotlib>=3.10.3",
    "pandas>=2.3.0",
    "plotly>=6.1.2",
    "pytest>=8.4.1",
    "seaborn>=0.13.2",
    "umap-learn>=0.5.7",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
]

[tool.ruff]
line-length = 88
select = ["SIM"]

